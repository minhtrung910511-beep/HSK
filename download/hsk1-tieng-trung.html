// ==================== SRS ====================
const STORAGE_KEY = "hsk1-progress-v1";
const DAY_MS = 24 * 60 * 60 * 1000;

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function defaultProgress() {
  return {
    cards: {}, learnedWordIds: [],
    streak: { current: 0, longest: 0, lastStudyDate: "" },
    totalReviews: 0, correctReviews: 0, dailyStats: {},
    quizHighScore: 0, matchingHighScore: 0,
  };
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    return { ...defaultProgress(), ...JSON.parse(raw) };
  } catch (e) { return defaultProgress(); }
}

function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e) {}
}

function newCard(wordId) {
  return { wordId, repetitions: 0, interval: 0, easeFactor: 2.5, dueDate: Date.now(), lastReviewed: null, history: [] };
}

function reviewCard(card, grade, now) {
  now = now || Date.now();
  let repetitions = card.repetitions;
  let interval = card.interval;
  let easeFactor = card.easeFactor;
  const newEase = Math.max(1.3, easeFactor + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02)));
  if (grade < 3) {
    repetitions = 0; interval = 1;
  } else {
    repetitions += 1;
    if (repetitions === 1) interval = 1;
    else if (repetitions === 2) interval = 3;
    else interval = Math.round(interval * newEase);
  }
  return Object.assign({}, card, {
    repetitions, interval, easeFactor: newEase,
    dueDate: now + interval * DAY_MS,
    lastReviewed: now,
    history: card.history.concat([{ date: now, grade }]),
  });
}

function getDueCards(progress, allWordIds) {
  const now = Date.now();
  return allWordIds.filter(function(wordId) {
    const card = progress.cards[wordId];
    return !card || card.dueDate <= now;
  });
}

function gradeWord(progress, wordId, grade) {
  const now = Date.now();
  const existing = progress.cards[wordId] || newCard(wordId);
  const updated = reviewCard(existing, grade, now);
  const today = todayKey();
  const dailyStats = Object.assign({}, progress.dailyStats);
  if (!dailyStats[today]) dailyStats[today] = { studied: 0, correct: 0 };
  dailyStats[today].studied += 1;
  if (grade >= 3) dailyStats[today].correct += 1;
  const lastDate = progress.streak.lastStudyDate;
  let current = progress.streak.current;
  let longest = progress.streak.longest;
  if (lastDate !== today) {
    const y = new Date(now - DAY_MS);
    const yKey = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,"0")}-${String(y.getDate()).padStart(2,"0")}`;
    current = lastDate === yKey ? current + 1 : 1;
    if (current > longest) longest = current;
  }
  const learnedSet = new Set(progress.learnedWordIds);
  if (grade >= 3) learnedSet.add(wordId);
  return Object.assign({}, progress, {
    cards: Object.assign({}, progress.cards, { [wordId]: updated }),
    learnedWordIds: Array.from(learnedSet),
    totalReviews: progress.totalReviews + 1,
    correctReviews: progress.correctReviews + (grade >= 3 ? 1 : 0),
    streak: { current, longest, lastStudyDate: today },
    dailyStats,
  });
}

function markLearned(progress, wordId) {
  const s = new Set(progress.learnedWordIds);
  s.add(wordId);
  return Object.assign({}, progress, { learnedWordIds: Array.from(s) });
}

// ==================== Hook: useProgress ====================
function useProgress() {
  const [progress, setProgress] = useState(null);
  const [hydrated, setHydrated] = useState(false);
  useEffect(function() {
    setProgress(loadProgress());
    setHydrated(true);
  }, []);
  const grade = useCallback(function(wordId, g) {
    setProgress(function(p) { if (!p) return p; const next = gradeWord(p, wordId, g); saveProgress(next); return next; });
  }, []);
  const markLearnedWord = useCallback(function(wordId) {
    setProgress(function(p) { if (!p) return p; const next = markLearned(p, wordId); saveProgress(next); return next; });
  }, []);
  const recordQuizScore = useCallback(function(score) {
    setProgress(function(p) { if (!p) return p; const next = score > p.quizHighScore ? Object.assign({}, p, { quizHighScore: score }) : p; saveProgress(next); return next; });
  }, []);
  const recordMatchingScore = useCallback(function(score) {
    setProgress(function(p) { if (!p) return p; const next = score > p.matchingHighScore ? Object.assign({}, p, { matchingHighScore: score }) : p; saveProgress(next); return next; });
  }, []);
  const reset = useCallback(function() {
    const fresh = defaultProgress(); saveProgress(fresh); setProgress(fresh);
  }, []);
  return { progress, hydrated, grade, markLearnedWord, recordQuizScore, recordMatchingScore, reset };
}

// ==================== Helpers ====================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function speak(text) {
  if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN"; u.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(function(v) { return v.lang.startsWith("zh"); });
  if (zh) u.voice = zh;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

function Flashcard(props) {
  const topicId = props.topicId || "all";
  const onGrade = props.onGrade;
  const onMarkLearned = props.onMarkLearned;
  const dueWordIds = props.dueWordIds;
  const [deck, setDeck] = useState([]);
  const [index, setIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);

  useEffect(function() {
    let words = [];
    if (topicId === "all") words = VOCAB.slice();
    else if (topicId === "due") {
      const ids = new Set(dueWordIds || []);
      words = VOCAB.filter(function(w) { return ids.has(w.id); });
    } else {
      words = VOCAB.filter(function(w) { return w.topic === topicId; });
    }
    setDeck(words);
    setIndex(0);
    setFlipped(false);
  }, [topicId, dueWordIds]);

  const current = deck[index];

  const goNext = useCallback(function() {
    setFlipped(false);
    setTimeout(function() { setIndex(function(i) { return (i + 1) % Math.max(deck.length, 1); }); }, 120);
  }, [deck.length]);

  const goPrev = useCallback(function() {
    setFlipped(false);
    setTimeout(function() { setIndex(function(i) { return (i - 1 + deck.length) % Math.max(deck.length, 1); }); }, 120);
  }, [deck.length]);

  const handleGrade = useCallback(function(grade) {
    if (!current) return;
    if (onGrade) onGrade(current.id, grade);
    if (grade >= 3 && onMarkLearned) onMarkLearned(current.id);
    goNext();
  }, [current, onGrade, onMarkLearned, goNext]);

  useEffect(function() {
    function handler(e) {
      if (!current) return;
      if (e.code === "Space") { e.preventDefault(); setFlipped(function(f) { return !f; }); }
      else if (e.code === "ArrowRight") goNext();
      else if (e.code === "ArrowLeft") goPrev();
      else if (e.code === "Digit1") handleGrade(0);
      else if (e.code === "Digit2") handleGrade(3);
      else if (e.code === "Digit3") handleGrade(5);
    }
    window.addEventListener("keydown", handler);
    return function() { window.removeEventListener("keydown", handler); };
  }, [current, goNext, goPrev, handleGrade]);

  if (deck.length === 0 || !current) {
    return html`
      <div className="flex flex-col items-center justify-center py-20 text-center">
        <div className="text-6xl mb-4">🎉</div>
        <h3 className="text-xl font-semibold mb-2">Tuyệt vời!</h3>
        <p className="text-gray-600">${topicId === "due" ? "Không có từ nào cần ôn lúc này. Hãy quay lại sau hoặc học chủ đề mới!" : "Chưa có từ vựng trong bộ này."}</p>
      </div>`;
  }

  const topic = getTopic(current.topic);

  return html`
    <div className="flex flex-col gap-6">
      <div className="space-y-2">
        <div className="flex items-center justify-between text-sm text-gray-500">
          <span>Thẻ ${index + 1} / ${deck.length}</span>
          <span>${Math.round(((index + 1) / deck.length) * 100)}%</span>
        </div>
        <div className="h-2 rounded-full bg-gray-200 overflow-hidden">
          <div className="h-full bg-gradient-to-r from-violet-500 to-fuchsia-500 transition-all" style=${{width: ((index + 1) / deck.length * 100) + "%"}}></div>
        </div>
      </div>

      <div className=${"flip-card w-full h-[420px] cursor-pointer" + (flipped ? " flipped" : "")} onClick=${function() { setFlipped(function(f) { return !f; }); }}>
        <div className="flip-card-inner">
          <div className=${"flip-card-front rounded-3xl flex flex-col items-center justify-center gap-4 p-8 bg-gradient-to-br " + topic.color + " shadow-xl text-white overflow-hidden"}>
            <div className="absolute top-4 left-4">
              <span className="px-2 py-1 rounded-full bg-white/25 text-white text-xs">${topic.emoji} ${topic.name}</span>
            </div>
            <button className="absolute top-4 right-4 text-white hover:bg-white/20 p-2 rounded-full" onClick=${function(e) { e.stopPropagation(); speak(current.han); }}>🔊</button>
            <div className="text-7xl mb-2">${current.emoji}</div>
            <div className="text-7xl md:text-8xl font-bold tracking-tight drop-shadow-lg">${current.han}</div>
            <div className="text-2xl font-medium opacity-95 italic">${current.pinyin}</div>
            <div className="absolute bottom-4 text-white/80 text-xs">👆 Nhấp để lật thẻ xem nghĩa</div>
          </div>
          <div className="flip-card-back rounded-3xl flex flex-col gap-4 p-6 bg-white shadow-xl border-2 border-violet-200">
            <div className="flex items-center justify-between">
              <span className="px-2 py-1 rounded-full bg-gray-100 text-xs">${current.pos}</span>
              <button className="p-2 hover:bg-gray-100 rounded-full" onClick=${function(e) { e.stopPropagation(); speak(current.han); }}>🔊</button>
            </div>
            <div className="flex flex-col items-center gap-1">
              <div className="text-5xl font-bold">${current.han}</div>
              <div className="text-base text-gray-500 italic">${current.pinyin}</div>
              <div className="text-3xl font-semibold text-violet-600 mt-2">${current.meaning}</div>
            </div>
            <div className="border-t border-dashed border-violet-200 pt-3 space-y-1">
              <div className="text-xs uppercase tracking-wide text-gray-500">Ví dụ</div>
              <div className="text-lg font-medium">${current.ex}</div>
              <div className="text-sm italic text-gray-500">${current.exp}</div>
              <div className="text-sm text-gray-700">${current.exv}</div>
            </div>
          </div>
        </div>
      </div>

      <div className="flex items-center justify-between gap-3">
        <button className="p-2 rounded-lg border border-gray-300 hover:bg-gray-100 disabled:opacity-50" onClick=${goPrev} disabled=${deck.length < 2}>←</button>
        <div className="flex gap-2 flex-1 justify-center">
          <button className="px-4 py-2 rounded-lg border-2 border-rose-200 text-rose-600 hover:bg-rose-50 text-sm font-medium flex items-center gap-2" onClick=${function() { handleGrade(0); }}>❌ Chưa nhớ <kbd className="ml-1 text-[10px] px-1 py-0.5 rounded bg-rose-100 text-rose-700">1</kbd></button>
          <button className="px-4 py-2 rounded-lg border-2 border-amber-200 text-amber-600 hover:bg-amber-50 text-sm font-medium flex items-center gap-2" onClick=${function() { handleGrade(3); }}>✅ Nhớ <kbd className="ml-1 text-[10px] px-1 py-0.5 rounded bg-amber-100 text-amber-700">2</kbd></button>
          <button className="px-4 py-2 rounded-lg border-2 border-emerald-200 text-emerald-600 hover:bg-emerald-50 text-sm font-medium flex items-center gap-2" onClick=${function() { handleGrade(5); }}>✨ Dễ <kbd className="ml-1 text-[10px] px-1 py-0.5 rounded bg-emerald-100 text-emerald-700">3</kbd></button>
        </div>
        <button className="p-2 rounded-lg border border-gray-300 hover:bg-gray-100 disabled:opacity-50" onClick=${goNext} disabled=${deck.length < 2}>→</button>
      </div>

      <div className="text-center text-xs text-gray-500">
        Phím tắt: <kbd className="px-1.5 py-0.5 rounded bg-gray-100">Space</kbd> lật thẻ • <kbd className="px-1.5 py-0.5 rounded bg-gray-100">←/→</kbd> chuyển • <kbd className="px-1.5 py-0.5 rounded bg-gray-100">1/2/3</kbd> đánh giá
      </div>
    </div>`;
}

// ==================== Quiz ====================
const QUIZ_TIME = 15;
const QUIZ_COUNT = 10;

function Quiz(props) {
  const onQuizComplete = props.onQuizComplete;
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState(0);
  const [timeLeft, setTimeLeft] = useState(QUIZ_TIME);
  const [phase, setPhase] = useState("intro");
  const completedRef = useRef(false);

  const generateQuiz = useCallback(function() {
    const pool = shuffle(VOCAB).slice(0, QUIZ_COUNT);
    const modes = ["han-to-vi", "vi-to-han", "pinyin-to-han"];
    const qs = pool.map(function(word) {
      const mode = modes[Math.floor(Math.random() * modes.length)];
      const distractors = shuffle(VOCAB.filter(function(w) { return w.id !== word.id; })).slice(0, 3);
      let correct, options;
      if (mode === "han-to-vi") {
        correct = word.meaning;
        options = shuffle([correct].concat(distractors.map(function(d) { return d.meaning; })));
      } else if (mode === "vi-to-han") {
        correct = word.han;
        options = shuffle([correct].concat(distractors.map(function(d) { return d.han; })));
      } else {
        correct = word.han;
        options = shuffle([correct].concat(distractors.map(function(d) { return d.han; })));
      }
      return { word, options, correct, mode };
    });
    setQuestions(qs);
    setCurrent(0); setSelected(null); setScore(0); setTimeLeft(QUIZ_TIME);
    completedRef.current = false;
  }, []);

  function start() { generateQuiz(); setPhase("playing"); }

  useEffect(function() {
    if (phase !== "playing") return;
    if (selected !== null) return;
    if (timeLeft <= 0) { setSelected("__timeout__"); return; }
    const t = setTimeout(function() { setTimeLeft(function(v) { return v - 1; }); }, 1000);
    return function() { clearTimeout(t); };
  }, [phase, selected, timeLeft]);

  function handleSelect(opt) {
    if (selected !== null) return;
    setSelected(opt);
    if (opt === questions[current].correct) setScore(function(s) { return s + 1; });
  }

  function next() {
    if (current + 1 >= questions.length) {
      setPhase("result");
      return;
    }
    setCurrent(function(c) { return c + 1; });
    setSelected(null);
    setTimeLeft(QUIZ_TIME);
  }

  useEffect(function() {
    if (phase === "result" && !completedRef.current && questions.length > 0) {
      completedRef.current = true;
      if (onQuizComplete) onQuizComplete(score, questions.length);
    }
    if (phase !== "result") completedRef.current = false;
  }, [phase, score, questions.length, onQuizComplete]);

  if (phase === "intro") {
    return html`
      <div className="p-8 flex flex-col items-center gap-6 text-center rounded-3xl bg-gradient-to-br from-violet-100 via-fuchsia-50 to-pink-100">
        <div className="w-20 h-20 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center shadow-lg text-4xl">🏆</div>
        <div>
          <h3 className="text-2xl font-bold mb-2">Quiz trắc nghiệm</h3>
          <p className="text-gray-600 max-w-md">${QUIZ_COUNT} câu hỏi • ${QUIZ_TIME} giây/câu • 3 dạng: Hán → Việt, Việt → Hán, Pinyin → Hán</p>
        </div>
        <button onClick=${start} className="px-6 py-3 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white hover:opacity-90 font-medium">Bắt đầu quiz 🔄</button>
      </div>`;
  }

  if (phase === "result") {
    const pct = Math.round((score / questions.length) * 100);
    const emoji = pct >= 80 ? "🏆" : pct >= 60 ? "🎉" : pct >= 40 ? "💪" : "📚";
    const title = pct >= 80 ? "Xuất sắc!" : pct >= 60 ? "Tốt lắm!" : pct >= 40 ? "Cố lên!" : "Cần luyện thêm!";
    return html`
      <div className="p-8 flex flex-col items-center gap-6 text-center rounded-3xl bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-50">
        <div className="text-7xl">${emoji}</div>
        <div>
          <h3 className="text-3xl font-bold mb-1">${title}</h3>
          <p className="text-gray-600">Bạn đã trả lời đúng</p>
        </div>
        <div className="text-6xl font-bold bg-gradient-to-r from-emerald-500 to-teal-500 bg-clip-text text-transparent">${score}/${questions.length}</div>
        <span className="px-4 py-1 rounded-full bg-gray-100 text-base">${pct}% chính xác</span>
        <div className="flex gap-3">
          <button onClick=${start} className="px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white">🔄 Làm lại</button>
          <button onClick=${function() { setPhase("intro"); }} className="px-4 py-2 rounded-xl border border-gray-300">Về trang quiz</button>
        </div>
      </div>`;
  }

  const q = questions[current];
  if (!q) return null;
  const promptLabel = q.mode === "han-to-vi" ? "Chọn nghĩa tiếng Việt" : q.mode === "vi-to-han" ? "Chọn Hán tự đúng" : "Chọn Hán tự theo pinyin";

  return html`
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between gap-4">
        <span className="px-2 py-1 rounded-full bg-gray-100 text-sm">Câu ${current + 1} / ${questions.length}</span>
        <div className="flex items-center gap-2">
          <span className="px-2 py-1 rounded-full bg-amber-100 text-amber-700 text-sm">⏱ ${timeLeft}s</span>
          <span className="px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 text-sm">🏆 ${score}</span>
        </div>
      </div>

      <div className="h-1.5 rounded-full bg-amber-100 overflow-hidden">
        <div className="h-full bg-amber-400 transition-all" style=${{width: (timeLeft / QUIZ_TIME * 100) + "%"}}></div>
      </div>

      <div className="p-6 md:p-8 flex flex-col items-center gap-4 rounded-3xl bg-gradient-to-br from-violet-50 to-fuchsia-50 border-2 border-violet-100">
        <div className="text-xs uppercase tracking-wider text-gray-500">${promptLabel}</div>
        <div className="flex items-center gap-3">
          <div className="text-5xl md:text-6xl font-bold">
            ${q.mode === "han-to-vi" ? q.word.han : null}
            ${q.mode === "vi-to-han" ? q.word.meaning : null}
            ${q.mode === "pinyin-to-han" ? html`<span className="italic">${q.word.pinyin}</span>` : null}
          </div>
          ${q.mode === "han-to-vi" ? html`<button className="p-2 hover:bg-gray-100 rounded-full" onClick=${function() { speak(q.word.han); }}>🔊</button>` : null}
        </div>
        ${q.mode === "han-to-vi" ? html`<div className="text-base italic text-gray-500">${q.word.pinyin}</div>` : null}
        ${q.mode === "vi-to-han" ? html`<div className="text-sm text-gray-500">${q.word.emoji} ${q.word.pos}</div>` : null}
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${q.options.map(function(opt) {
          const isCorrect = opt === q.correct;
          const isSelected = opt === selected;
          let cls = "border-2 hover:border-violet-300 hover:bg-violet-50 transition-all justify-start text-left";
          if (selected !== null) {
            if (isCorrect) cls = "border-2 border-emerald-400 bg-emerald-50 text-emerald-700 justify-start text-left";
            else if (isSelected) cls = "border-2 border-rose-400 bg-rose-50 text-rose-700 justify-start text-left";
            else cls = "border-2 border-gray-200 opacity-60 justify-start text-left";
          }
          return html`
            <button key=${opt} className=${"py-4 px-4 text-lg rounded-xl " + cls} onClick=${function() { handleSelect(opt); }} disabled=${selected !== null}>
              <span className="flex-1">${opt}</span>
              ${selected !== null && isCorrect ? " ✓" : null}
              ${selected !== null && isSelected && !isCorrect ? " ✗" : null}
            </button>`;
        })}
      </div>

      ${selected !== null ? html`
        <div className="flex justify-end">
          <button onClick=${next} className="px-4 py-2 rounded-xl bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white">
            ${current + 1 >= questions.length ? "Xem kết quả" : "Câu tiếp theo"}
          </button>
        </div>
      ` : null}
    </div>`;
}

// ==================== Matching ====================
const MATCH_PAIRS = 6;
const MATCH_LIVES = 3;

function Matching(props) {
  const onComplete = props.onComplete;
  const [phase, setPhase] = useState("intro");
  const [cells, setCells] = useState([]);
  const [matched, setMatched] = useState(new Set());
  const [selected, setSelected] = useState(null);
  const [wrongPair, setWrongPair] = useState(null);
  const [lives, setLives] = useState(MATCH_LIVES);
  const [seconds, setSeconds] = useState(0);
  const completedRef = useRef(false);

  const start = useCallback(function() {
    const pool = shuffle(VOCAB).slice(0, MATCH_PAIRS);
    const hanCells = pool.map(function(w) { return { id: "h-" + w.id, wordId: w.id, side: "han", text: w.han, pinyin: w.pinyin, emoji: w.emoji }; });
    const viCells = pool.map(function(w) { return { id: "v-" + w.id, wordId: w.id, side: "vi", text: w.meaning }; });
    setCells(shuffle(hanCells.concat(viCells)));
    setMatched(new Set()); setSelected(null); setWrongPair(null);
    setLives(MATCH_LIVES); setSeconds(0); setPhase("playing");
    completedRef.current = false;
  }, []);

  useEffect(function() {
    if (phase !== "playing") return;
    const t = setInterval(function() { setSeconds(function(s) { return s + 1; }); }, 1000);
    return function() { clearInterval(t); };
  }, [phase]);

  useEffect(function() {
    if (phase !== "playing") return;
    if (cells.length > 0 && matched.size === cells.length) setPhase("won");
  }, [matched, cells.length, phase]);

  useEffect(function() {
    if (phase !== "playing") return;
    if (lives <= 0) setPhase("lost");
  }, [lives, phase]);

  useEffect(function() {
    if (phase === "won" && !completedRef.current) {
      completedRef.current = true;
      const score = Math.max(0, 1000 - seconds * 5 + lives * 100);
      if (onComplete) onComplete(score);
    }
    if (phase !== "won") completedRef.current = false;
  }, [phase, seconds, lives, onComplete]);

  function handleClick(cell) {
    if (matched.has(cell.id) || wrongPair) return;
    if (!selected) { setSelected(cell); return; }
    if (selected.id === cell.id) { setSelected(null); return; }
    if (selected.side === cell.side) { setSelected(cell); return; }
    if (selected.wordId === cell.wordId) {
      const nm = new Set(matched); nm.add(selected.id); nm.add(cell.id);
      setMatched(nm); setSelected(null);
    } else {
      setWrongPair([selected.id, cell.id]);
      setLives(function(l) { return l - 1; });
      setTimeout(function() { setWrongPair(null); setSelected(null); }, 800);
    }
  }

  if (phase === "intro") {
    return html`
      <div className="p-8 flex flex-col items-center gap-6 text-center rounded-3xl bg-gradient-to-br from-teal-100 via-cyan-50 to-sky-100">
        <div className="w-20 h-20 rounded-full bg-gradient-to-br from-teal-500 to-cyan-500 flex items-center justify-center shadow-lg text-4xl">✓</div>
        <div>
          <h3 className="text-2xl font-bold mb-2">Ghép cặp từ</h3>
          <p className="text-gray-600 max-w-md">Ghép ${MATCH_PAIRS} cặp Hán tự ↔ Nghĩa tiếng Việt. ${MATCH_LIVES} mạng, càng nhanh điểm càng cao!</p>
        </div>
        <button onClick=${start} className="px-6 py-3 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-500 text-white hover:opacity-90 font-medium">Bắt đầu ghép cặp 🔄</button>
      </div>`;
  }

  if (phase === "won" || phase === "lost") {
    const score = phase === "won" ? Math.max(0, 1000 - seconds * 5 + lives * 100) : 0;
    return html`
      <div className=${"p-8 flex flex-col items-center gap-6 text-center rounded-3xl " + (phase === "won" ? "bg-gradient-to-br from-emerald-100 via-teal-50 to-cyan-100" : "bg-gradient-to-br from-rose-100 via-pink-50 to-red-100")}>
        <div className="text-7xl">${phase === "won" ? "🏆" : "💔"}</div>
        <div>
          <h3 className="text-3xl font-bold mb-1">${phase === "won" ? "Chiến thắng!" : "Hết mạng!"}</h3>
          <p className="text-gray-600">${phase === "won" ? "Hoàn thành trong " + seconds + "s, còn " + lives + " mạng" : "Đừng nản, thử lại nhé!"}</p>
        </div>
        ${phase === "won" ? html`<div className="text-5xl font-bold bg-gradient-to-r from-emerald-500 to-teal-500 bg-clip-text text-transparent">${score} điểm</div>` : null}
        <div className="flex gap-3">
          <button onClick=${start} className="px-4 py-2 rounded-xl bg-gradient-to-r from-teal-500 to-cyan-500 text-white">🔄 Chơi lại</button>
          <button onClick=${function() { setPhase("intro"); }} className="px-4 py-2 rounded-xl border border-gray-300">Về trang ghép cặp</button>
        </div>
      </div>`;
  }

  return html`
    <div className="flex flex-col gap-5">
      <div className="flex items-center justify-between gap-4">
        <div className="flex items-center gap-2">
          ${Array.from({ length: MATCH_LIVES }).map(function(_, i) {
            return html`<span key=${i} className=${"text-xl " + (i < lives ? "" : "opacity-30 grayscale")}>❤️</span>`;
          })}
        </div>
        <div className="flex items-center gap-2">
          <span className="px-2 py-1 rounded-full bg-sky-100 text-sky-700 text-sm">⏱ ${seconds}s</span>
          <span className="px-2 py-1 rounded-full bg-emerald-100 text-emerald-700 text-sm">✓ ${matched.size / 2}/${MATCH_PAIRS}</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3 md:gap-4">
        ${cells.map(function(cell) {
          const isMatched = matched.has(cell.id);
          const isSelected = selected && selected.id === cell.id;
          const isWrong = wrongPair && wrongPair.indexOf(cell.id) !== -1;
          let cls = "bg-white border-slate-200 hover:border-violet-300 hover:shadow-md";
          if (isMatched) cls = "bg-emerald-100 border-emerald-300 opacity-50";
          else if (isWrong) cls = "bg-rose-100 border-rose-400 pulse-wrong";
          else if (isSelected) cls = "bg-gradient-to-br from-violet-500 to-fuchsia-500 border-violet-600 text-white shadow-lg scale-105";
          return html`
            <button key=${cell.id} onClick=${function() { handleClick(cell); }} disabled=${isMatched} className=${"relative rounded-2xl p-4 md:p-5 min-h-[100px] md:min-h-[120px] flex flex-col items-center justify-center gap-1 transition-all border-2 " + cls}>
              ${cell.side === "han" ? html`
                <div>
                  <div className="text-3xl">${cell.emoji}</div>
                  <div className="text-2xl md:text-3xl font-bold">${cell.text}</div>
                  ${!isMatched ? html`<div className=${"text-xs italic " + (isSelected ? "text-white/80" : "text-gray-500")}>${cell.pinyin}</div>` : null}
                </div>
              ` : html`<div className="text-base md:text-lg font-semibold text-center">${cell.text}</div>`}
              ${isMatched ? html`<span className="absolute top-2 right-2 text-emerald-600">✓</span>` : null}
            </button>`;
        })}
      </div>

      <div className="text-center text-xs text-gray-500">Nhấp vào 1 từ Hán và 1 nghĩa tiếng Việt để ghép cặp</div>
    </div>`;
}

// ==================== Main App ====================
function App() {
  const [tab, setTab] = useState("home");
  const [scope, setScope] = useState("all");
  const { progress, hydrated, grade, markLearnedWord, recordQuizScore, recordMatchingScore, reset } = useProgress();

  const allWordIds = useMemo(function() { return VOCAB.map(function(w) { return w.id; }); }, []);
  const dueIds = useMemo(function() { return progress ? getDueCards(progress, allWordIds) : []; }, [progress, allWordIds]);

  function startDue() { setScope("due"); setTab("flashcard"); }
  function handleTopicClick(topicId) { setScope(topicId); setTab("flashcard"); }

  const tabs = [
    { id: "home",      label: "Trang chủ",  icon: "🏠" },
    { id: "flashcard", label: "Flashcard",  icon: "🎴" },
    { id: "quiz",      label: "Quiz",       icon: "❓" },
    { id: "matching",  label: "Ghép cặp",   icon: "🔀" },
  ];

  function ScopeChip(p) {
    let cls = "px-3 py-1.5 rounded-full text-xs font-medium transition-all ";
    if (p.active) cls += "bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white shadow";
    else if (p.disabled) cls += "bg-gray-100 text-gray-400 cursor-not-allowed";
    else cls += "bg-white text-gray-900 border border-gray-300 hover:border-violet-300 hover:bg-violet-50";
    return html`<button onClick=${p.onClick} disabled=${p.disabled} className=${cls}>${p.label}</button>`;
  }

  return html`
    <div className="min-h-screen flex flex-col bg-gradient-to-br from-violet-50 via-rose-50 to-amber-50">
      <header className="sticky top-0 z-40 backdrop-blur-md bg-white/70 border-b border-white/40">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 via-fuchsia-500 to-violet-500 flex items-center justify-center shadow-md text-xl">🎓</div>
            <div>
              <h1 className="text-lg md:text-xl font-bold bg-gradient-to-r from-rose-600 via-fuchsia-600 to-violet-600 bg-clip-text text-transparent leading-tight">HSK1 Tiếng Trung</h1>
              <p className="text-xs text-gray-500 hidden sm:block">Học từ vựng dễ nhớ • 150 từ HSK 1.0</p>
            </div>
          </div>
          <nav className="flex items-center gap-1 bg-white/60 rounded-xl p-1 border border-white/60 shadow-sm">
            ${tabs.map(function(t) {
              let cls = "flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all ";
              if (tab === t.id) cls += "bg-gradient-to-r from-violet-500 to-fuchsia-500 text-white shadow";
              else cls += "text-gray-500 hover:text-gray-900 hover:bg-white/70";
              return html`<button key=${t.id} onClick=${function() { setTab(t.id); }} className=${cls}>
                <span>${t.icon}</span>
                <span className="hidden sm:inline">${t.label}</span>
              </button>`;
            })}
          </nav>
        </div>
      </header>

      <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 md:py-8">
        ${!hydrated ? html`
          <div className="flex items-center justify-center py-32">
            <div className="animate-spin w-10 h-10 border-4 border-violet-500 border-t-transparent rounded-full"></div>
          </div>
        ` : null}
        ${hydrated && tab === "home" ? html`<${Dashboard} progress=${progress} onTopicClick=${handleTopicClick} onStartDue=${startDue} />` : null}
        ${hydrated && tab === "flashcard" ? html`
          <div className="flex flex-col gap-4">
            <div className="p-3 rounded-2xl bg-white/70 backdrop-blur shadow-sm">
              <div className="flex flex-wrap gap-2 items-center">
                <span className="text-xs font-medium text-gray-500 mr-1">Chọn bộ thẻ:</span>
                <${ScopeChip} active=${scope === "all"} onClick=${function() { setScope("all"); }} label=${"📚 Tất cả (" + VOCAB.length + ")"} />
                <${ScopeChip} active=${scope === "due"} onClick=${function() { setScope("due"); }} label=${"⏰ Cần ôn (" + dueIds.length + ")"} disabled=${dueIds.length === 0} />
                <div className="w-px h-5 bg-gray-300 mx-1"></div>
                ${TOPICS.map(function(t) {
                  const count = VOCAB.filter(function(w) { return w.topic === t.id; }).length;
                  return html`<${ScopeChip} key=${t.id} active=${scope === t.id} onClick=${function() { setScope(t.id); }} label=${t.emoji + " " + t.name + " (" + count + ")"} />`;
                })}
              </div>
            </div>
            <${Flashcard} topicId=${scope} dueWordIds=${dueIds} onGrade=${grade} onMarkLearned=${markLearnedWord} />
          </div>
        ` : null}
        ${hydrated && tab === "quiz" ? html`
          <div className="max-w-3xl mx-auto"><${Quiz} onQuizComplete=${function(s) { recordQuizScore(s * 10); }} /></div>
        ` : null}
        ${hydrated && tab === "matching" ? html`
          <div className="max-w-3xl mx-auto"><${Matching} onComplete=${recordMatchingScore} /></div>
        ` : null}

        ${hydrated && tab === "home" && progress && progress.totalReviews > 0 ? html`
          <div className="mt-8 text-center">
            <button onClick=${function() { if (confirm("Xóa toàn bộ tiến độ học tập? Hành động này không thể hoàn tác.")) reset(); }} className="text-xs text-gray-500 hover:text-rose-600">🗑️ Xóa tiến độ & bắt đầu lại</button>
          </div>
        ` : null}
      </main>

      <footer className="mt-auto border-t border-white/40 bg-white/40 backdrop-blur py-4">
        <div className="max-w-6xl mx-auto px-4 text-center text-xs text-gray-500">
          <p className="flex items-center justify-center gap-1.5"><span>✨</span> HSK1 Vocabulary • 150 từ • SRS + Flashcard + Quiz + Matching</p>
          <p className="mt-1 opacity-70">Dữ liệu học tập được lưu trong trình duyệt của bạn</p>
        </div>
      </footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
